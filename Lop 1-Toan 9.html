<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 BÉ VUI HỌC TOÁN LỚP 1 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-pink: #FF6B8B;
      --primary-hover: #FF4772;
      --secondary-purple: #8854D0;
      --mint-green: #20BF6B;
      --warm-yellow: #FECA57;
      --soft-blue: #45AAF2;
      --coral-red: #EB3B5A;
      --dark-text: #2C3E50;
      --card-bg: #FFFFFF;
      --shadow-color: rgba(255, 107, 139, 0.15);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', cursive, sans-serif;
      background: linear-gradient(135deg, #FFEAA7 0%, #FFB8B8 50%, #FFDEE9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      color: var(--dark-text);
      overflow-x: hidden;
    }
    #app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 980px;
      min-height: 580px;
      border-radius: 26px;
      box-shadow: 0 16px 40px var(--shadow-color);
      border: 6px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #FF758C 0%, #FF7EB3 50%, #FFB199 100%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: white;
    }

    /* BÉ THỎ HOẠT HÌNH LẮC LƯ TRANG BÌA */
    .bunny-mascot-container {
      width: 130px;
      height: 130px;
      margin-bottom: 6px;
      animation: bunnySway 2.4s ease-in-out infinite;
      transform-origin: bottom center;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    }
    @keyframes bunnySway {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-8px); }
    }
    .bunny-ear-left {
      animation: earWiggleLeft 2.4s ease-in-out infinite;
      transform-origin: 35px 45px;
    }
    .bunny-ear-right {
      animation: earWiggleRight 2.4s ease-in-out infinite;
      transform-origin: 65px 45px;
    }
    @keyframes earWiggleLeft {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes earWiggleRight {
      0%, 100% { transform: rotate(4deg); }
      50% { transform: rotate(-6deg); }
    }

    .big-start-btn {
      background: #FFF;
      color: #FF4757;
      font-size: 22px;
      font-weight: 900;
      padding: 12px 38px;
      border-radius: 50px;
      border: none;
      box-shadow: 0 6px 0 #FF6B81;
      cursor: pointer;
      margin-top: 14px;
      animation: pulse 1.6s infinite;
      transition: 0.15s ease;
    }
    .big-start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #FF6B81;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    header {
      background: #FFF5F7;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #FFD1DC;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-nav {
      background: #FFF;
      border: 2px solid var(--primary-pink);
      font-size: 13.5px;
      font-weight: 800;
      color: var(--primary-pink);
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #FFB8C6;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.1s;
      white-space: nowrap;
    }
    .btn-nav:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #FFB8C6;
    }
    .category-tab-badge {
      background: linear-gradient(135deg, #FF6B8B, #FF8E53);
      color: #FFF;
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 14px;
      box-shadow: 0 3px 0 #D35400;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .header-title-text {
      font-size: 15px;
      font-weight: 900;
      color: var(--secondary-purple);
      text-transform: uppercase;
      text-align: center;
    }
    .score-badge {
      background: linear-gradient(135deg, #FFEAA7, #FDCB6E);
      color: #B7791F;
      font-size: 14.5px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 50px;
      box-shadow: 0 3px 0 #E17055;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* THANH TAB ĐIỀU HƯỚNG CHUYÊN ĐỀ CON PHÍA TRÊN */
    #subtopic-tabs-bar {
      width: 100%;
      background: #FFF0F5;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-bottom: 2px solid #FFD1DC;
      overflow-x: auto;
    }
    .subtopic-tab-btn {
      background: #FFF;
      border: 2px solid #FFCCD5;
      color: var(--dark-text);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 0 #FFCCD5;
    }
    .subtopic-tab-btn:hover {
      background: #FFF5F7;
      border-color: var(--primary-pink);
    }
    .subtopic-tab-btn.active {
      background: linear-gradient(135deg, #FF6B8B, #FF8E53);
      color: #FFF;
      border-color: #E67E22;
      box-shadow: 0 3px 0 #D35400;
      transform: translateY(-1px);
    }

    #main-content {
      flex: 1;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: 460px;
    }

    .hub-title {
      font-size: 21px;
      font-weight: 900;
      color: var(--secondary-purple);
      margin: 2px 0 6px 0;
      text-shadow: 1px 1px 0 #FFF;
      text-align: center;
    }
    .topics-grid-10 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      width: 100%;
      max-width: 950px;
    }
    @media (max-width: 860px) {
      .topics-grid-10 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 560px) {
      .topics-grid-10 { grid-template-columns: repeat(2, 1fr); }
    }
    .subject-card {
      background: #FFF;
      border: 2px solid #FFCCD5;
      border-radius: 16px;
      padding: 8px 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 3px 0 #FFB8C6;
      min-height: 94px;
      text-align: center;
      position: relative;
    }
    .subject-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary-pink);
      box-shadow: 0 6px 0 var(--primary-pink);
    }
    .subject-card:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-pink);
    }
    .subject-card.group-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2.5px solid #FF6B8B;
      box-shadow: 0 4px 0 #FF4772;
    }
    .subject-card .icon-wrap {
      font-size: 24px;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .subject-card .title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--dark-text);
      line-height: 1.25;
    }
    .subject-card .count-tag {
      font-size: 10.5px;
      font-weight: 800;
      color: #718096;
      background: #EDF2F7;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .subject-card .badge-subitems {
      font-size: 10px;
      font-weight: 900;
      color: #FFF;
      background: linear-gradient(135deg, #FF6B8B, #FF8E53);
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 2px;
    }

    /* MỤC CON TRONG NHÓM ĐƠN VỊ & THỜI GIAN */
    .subhub-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
    }
    .subhub-header {
      background: #FFF0F5;
      border: 2px dashed #FF6B8B;
      padding: 12px 24px;
      border-radius: 18px;
      text-align: center;
      width: 100%;
    }
    .subhub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }
    @media (max-width: 640px) {
      .subhub-grid { grid-template-columns: 1fr; }
    }
    .subhub-card {
      background: #FFF;
      border: 3px solid #70A1FF;
      border-radius: 20px;
      padding: 20px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 0 #1E90FF;
      text-align: center;
    }
    .subhub-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 0 #1E90FF;
      border-color: #0984E3;
    }
    .subhub-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1E90FF;
    }
    .subhub-card .sub-icon { font-size: 46px; }
    .subhub-card .sub-title { font-size: 16px; font-weight: 900; color: #2C3E50; }
    .subhub-card .sub-desc { font-size: 12.5px; font-weight: 700; color: #64748B; }

    .question-prompt {
      font-size: 17px;
      font-weight: 800;
      color: var(--dark-text);
      margin: 0;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      text-align: center;
    }
    .speaker-btn {
      background: #E8F0FE;
      border: 2px solid #3498DB;
      font-size: 12.5px;
      padding: 3px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      color: #2980B9;
      box-shadow: 0 2px 0 #CBD5E1;
    }
    .speaker-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .stage-box {
      min-height: 140px;
      max-height: 205px;
      background: #FFFDF9;
      border-radius: 18px;
      border: 2px dashed #FCD5CE;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      position: relative;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 660px;
      margin-top: 2px;
    }
    .choice-btn {
      background: #FFF;
      border: 2px solid #70A1FF;
      color: var(--dark-text);
      font-size: 18.5px;
      font-weight: 900;
      padding: 8px 6px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1E90FF;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }
    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1E90FF;
    }
    .choice-btn.correct {
      background: #2ED573 !important;
      color: white !important;
      border-color: #26AF5F !important;
      box-shadow: 0 3px 0 #1B8A48 !important;
      animation: bounce 0.4s ease;
    }
    .choice-btn.wrong {
      background: #FF4757 !important;
      color: white !important;
      border-color: #C0392B !important;
      box-shadow: 0 3px 0 #962D22 !important;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .calc-result-box {
      font-size: 26px;
      font-weight: 900;
      color: #FF4757;
      background: #FFF3BF;
      padding: 2px 12px;
      border-radius: 14px;
      border: 2px dashed #F59F00;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .bottom-nav-bar {
      width: 100%;
      max-width: 660px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 2px dashed #F1F2F6;
      gap: 8px;
      margin-top: auto;
    }
    .btn-step {
      background: #FFF;
      color: var(--dark-text);
      font-size: 14px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 12px;
      border: 2px solid #CED6E0;
      box-shadow: 0 3px 0 #A4B0BE;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s ease;
    }
    .btn-step:hover { background: #F1F2F6; }
    .btn-step:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #A4B0BE;
    }
    .btn-step.next-btn {
      background: linear-gradient(135deg, #2ED573, #20BF6B);
      color: #FFF;
      border-color: #10AC84;
      box-shadow: 0 3px 0 #0C7A5D;
    }
    .btn-step.next-btn.highlight {
      animation: pulse 1.2s infinite;
    }
    .question-tracker {
      font-size: 13.5px;
      font-weight: 800;
      color: #747D8C;
      background: #F1F2F6;
      padding: 4px 12px;
      border-radius: 14px;
    }

    .game-asset-svg { width: 40px; height: 40px; }
    .hand-svg { width: 58px; height: 68px; }
    .hands-display-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #FFF;
      padding: 4px 10px;
      border-radius: 14px;
      border: 2px solid #FCD5CE;
    }
    .calc-row-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .kid-instruction-text {
      font-size: 13.5px;
      font-weight: 800;
      color: #D35400;
      background: #FFF9DB;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1.5px dashed #F59F00;
    }
    .sequence-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .seq-item {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #FFF;
      border: 2px solid #CBD5E1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: var(--dark-text);
    }
    .seq-item.target {
      background: #FFF9DB;
      border: 2px dashed #F59F00;
      color: #E67E22;
      animation: pulse 1.2s infinite;
    }

    #fx-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <canvas id="fx-canvas"></canvas>

    <div id="start-overlay">
      <div class="bunny-mascot-container">
        <svg viewBox="0 0 100 110" width="100%" height="100%">
          <g class="bunny-ear-left">
            <ellipse cx="32" cy="24" rx="9" ry="22" fill="#FFFFFF" stroke="#FFAAA6" stroke-width="2.5" />
            <ellipse cx="32" cy="24" rx="5" ry="15" fill="#FFCCD5" />
          </g>
          <g class="bunny-ear-right">
            <ellipse cx="68" cy="24" rx="9" ry="22" fill="#FFFFFF" stroke="#FFAAA6" stroke-width="2.5" />
            <ellipse cx="68" cy="24" rx="5" ry="15" fill="#FFCCD5" />
          </g>
          <ellipse cx="50" cy="85" rx="26" ry="20" fill="#FFFFFF" stroke="#FFAAA6" stroke-width="2.5" />
          <circle cx="50" cy="58" r="26" fill="#FFFFFF" stroke="#FFAAA6" stroke-width="2.5" />
          <circle cx="34" cy="64" r="5.5" fill="#FF7675" opacity="0.55" />
          <circle cx="66" cy="64" r="5.5" fill="#FF7675" opacity="0.55" />
          <circle cx="39" cy="54" r="4.5" fill="#2D3436" />
          <circle cx="40.5" cy="52.5" r="1.5" fill="#FFFFFF" />
          <circle cx="61" cy="54" r="4.5" fill="#2D3436" />
          <circle cx="62.5" cy="52.5" r="1.5" fill="#FFFFFF" />
          <polygon points="50,60 46,56 54,56" fill="#FF6B8B" />
          <path d="M46,62 Q50,66 54,62" stroke="#2D3436" stroke-width="2" fill="none" stroke-linecap="round" />
          <polygon points="50,76 40,70 40,82" fill="#FF4772" />
          <polygon points="50,76 60,70 60,82" fill="#FF4772" />
          <circle cx="50" cy="76" r="3.5" fill="#FFD1DC" />
        </svg>
      </div>

      <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 6px;">🌸 BÉ VUI HỌC TOÁN LỚP 1 🍎</h1>
      <p style="font-size: 15.5px; font-weight: 700; color: #FFF9DB; max-width: 600px; line-height: 1.4; margin-bottom: 12px;">
        Hơn 900+ câu hỏi bám sát 100% sách giáo khoa Toán lớp 1! Đầy đủ Tập 1 & Tập 2. Trộn ngẫu nhiên không trùng lặp!
      </p>
      <button class="big-start-btn" onclick="initAppAudio()">🚀 BẮT ĐẦU HỌC NGAY</button>
    </div>

    <header>
      <div class="header-left">
        <button class="btn-nav" onclick="renderHub()">🏠 Danh mục</button>
        <div id="header-category-tab" class="category-tab-badge" style="display: none;">
          📂 <span id="current-topic-badge-name">Chuyên đề</span>
        </div>
      </div>
      <div class="header-title-text" id="header-main-title">🔢 BÉ VUI HỌC TOÁN LỚP 1</div>
      <div class="score-badge">⭐ <span id="stars-count">0</span> Sao</div>
    </header>

    <div id="subtopic-tabs-bar" style="display: none;"></div>

    <div id="main-content"></div>
  </div>

  <script>
    // ==========================================
    // 1. TÀI NGUYÊN HÌNH KHỐI SVG VECTOR & BÀN TAY
    // ==========================================
    const SVG_LIB = {
      apple: `<svg viewBox="0 0 100 100" class="game-asset-svg"><circle cx="50" cy="55" r="38" fill="#FF4D4D"/><path d="M50,18 Q55,5 65,10" stroke="#8D6E63" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="62" cy="18" rx="8" ry="4" fill="#4CAF50" transform="rotate(-20, 62, 18)"/></svg>`,
      star: `<svg viewBox="0 0 100 100" class="game-asset-svg"><polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#FDCB6E" stroke="#E17055" stroke-width="3"/></svg>`,
      candy: `<svg viewBox="0 0 100 100" class="game-asset-svg"><circle cx="50" cy="50" r="28" fill="#FF7675" stroke="#D63031" stroke-width="3"/><polygon points="24,50 5,30 5,70" fill="#74B9FF"/><polygon points="76,50 95,30 95,70" fill="#74B9FF"/></svg>`,
      square: `<svg viewBox="0 0 100 100" class="game-asset-svg" style="width:64px;height:64px;"><rect x="15" y="15" width="70" height="70" rx="10" fill="#FF7675" stroke="#D63031" stroke-width="4"/></svg>`,
      circle: `<svg viewBox="0 0 100 100" class="game-asset-svg" style="width:64px;height:64px;"><circle cx="50" cy="50" r="38" fill="#74B9FF" stroke="#0984E3" stroke-width="4"/></svg>`,
      triangle: `<svg viewBox="0 0 100 100" class="game-asset-svg" style="width:64px;height:64px;"><polygon points="50,15 88,80 12,80" fill="#55EFC4" stroke="#00B894" stroke-width="4"/></svg>`,
      rect: `<svg viewBox="0 0 100 100" class="game-asset-svg" style="width:88px;height:58px;"><rect x="10" y="25" width="80" height="50" rx="8" fill="#FDCB6E" stroke="#E17055" stroke-width="4"/></svg>`,

    function generateSingleHandSvg(fingersCount, isLeft = true, skinColor = '#FFB074') {
      const f = Math.max(0, Math.min(5, fingersCount));
      const foldColor = '#E2E8F0', foldStroke = '#CBD5E1', activeColor = skinColor, activeStroke = '#E67E22';
      const up = [f >= 1, f >= 2, f >= 3, f >= 4, f >= 5];

      const pinky = up[4] ? `<rect x="75" y="25" width="13" height="42" rx="6.5" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2"/>` : `<circle cx="81" cy="56" r="6" fill="${foldColor}" stroke="${foldStroke}" stroke-width="2"/>`;
      const ring = up[3] ? `<rect x="58" y="14" width="14" height="55" rx="7" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2"/>` : `<circle cx="65" cy="55" r="7" fill="${foldColor}" stroke="${foldStroke}" stroke-width="2"/>`;
      const middle = up[2] ? `<rect x="41" y="8" width="14" height="62" rx="7" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2"/>` : `<circle cx="48" cy="54" r="7" fill="${foldColor}" stroke="${foldStroke}" stroke-width="2"/>`;
      const index = up[1] ? `<rect x="24" y="16" width="14" height="54" rx="7" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2"/>` : `<circle cx="31" cy="56" r="7" fill="${foldColor}" stroke="${foldStroke}" stroke-width="2"/>`;
      const thumb = up[0] ? `<path d="M12,50 Q4,42 8,30 Q12,24 18,34 L25,52 Z" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2"/>` : `<ellipse cx="18" cy="58" rx="6" ry="8" fill="${foldColor}" stroke="${foldStroke}" stroke-width="2"/>`;
      const palm = `<path d="M18,52 L83,52 C86,68 82,88 68,96 C50,98 32,98 18,92 C14,84 14,64 18,52 Z" fill="${activeColor}" stroke="${activeStroke}" stroke-width="2.5"/>`;
      const transformAttr = isLeft ? '' : 'transform="scale(-1, 1) translate(-100, 0)"';

      return `<svg viewBox="0 0 100 110" class="hand-svg"><g ${transformAttr}>${pinky}${ring}${middle}${index}${thumb}${palm}</g></svg>`;
    }

    function renderTwoHandsNumber(n, skinColor = '#FF9F43') {
      let leftFingers = n <= 5 ? n : 5;
      let rightFingers = n <= 5 ? 0 : n - 5;
      return `
        <div class="hands-display-wrapper">
          <div style="display:flex; flex-direction:column; align-items:center;">

        </div>
      `;

    // ==========================================
    // 2. THUẬT TOÁN SHUFFLE (FISHER-YATES)
    // ==========================================
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function makeChoices(correctVal, pool = null) {
      let c = [correctVal];
      if (typeof correctVal === 'number') {
        while (c.length < 4) {
          let delta = Math.floor(Math.random() * 7) - 3;
          let val = Math.max(0, correctVal + delta);
          if (!c.includes(val)) c.push(val);
        }
      } else if (pool) {
        let shuffled = shuffleArray(pool);
        for (let item of shuffled) {
          if (!c.includes(item)) c.push(item);
          if (c.length === 4) break;
        }
      }
      return shuffleArray(c);
    }

    let stars = 0, currentAnswer = null, audioCtx = null;

    function initVoiceSetup() {
      if ('speechSynthesis' in window) {
        const loadVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          preferredFemaleVoice = voices.find(v => 
            v.lang.includes('vi') && (
              v.name.includes('Google') || 
              v.name.includes('HoaiMy') || 
              v.name.includes('Linh') || 
              v.name.toLowerCase().includes('female')
            )
          ) || voices.find(v => v.lang.includes('vi')) || null;
        };
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }
    }
    initVoiceSetup();

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      document.getElementById('start-overlay').style.display = 'none';
      renderHub();
      speakClear("Chào bé yêu! Cùng khám phá các chuyên đề Toán học lớp 1 nhé!");
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    // HÀM NGẮT TRIỆT ĐỂ ÂM THANH ĐANG ĐỌC
    function stopAllSpeech() {
      currentSpeechSession++;
      try {
        onlineAudioPlayer.pause();
        onlineAudioPlayer.currentTime = 0;
        onlineAudioPlayer.removeAttribute('src');
      } catch (e) {}
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
    }

    function speakClear(text) {
      stopAllSpeech();
      const session = currentSpeechSession;
      if (!text) return;

      try {
        let cleanText = text.replace(/\+/g, ' cộng ')
                            .replace(/-/g, ' trừ ')
                            .replace(/=/g, ' bằng ')
                            .replace(/>/g, ' lớn hơn ')
                            .replace(/</g, ' bé hơn ')
                            .replace(/\.\.\./g, ' ba chấm ')
                            .replace(/\?/g, ' ');

        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.95;
        const playPromise = onlineAudioPlayer.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            if (session === currentSpeechSession) {
              fallbackWebSpeech(cleanText);
            }
          });
        }
      } catch (err) {
        if (session === currentSpeechSession) {
          fallbackWebSpeech(text);
        }
      }
    }

    function fallbackWebSpeech(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      if (preferredFemaleVoice) utterance.voice = preferredFemaleVoice;
      window.speechSynthesis.speak(utterance);
    }

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function triggerConfetti() {
      resizeCanvas();
      particles = [];
      const colors = ['#FF6B8B', '#20BF6B', '#FECA57', '#9B51E0', '#45AAF2', '#FF4757'];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14 - 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 7 + 3, life: 1
        });
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life -= 0.025;
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        if (p.life <= 0) particles.splice(idx, 1);
      });
      requestAnimationFrame(renderFX);
    }
    renderFX();

        stageHtml = `
          <div style="font-size:24px; font-weight:900; color:var(--secondary-purple); background:#FFF; padding:8px 20px; border-radius:14px; border:2px dashed #8E44AD; display:inline-flex; align-items:center;">
            ${q.total} ➔ ( ${q.p1} và <span id="calc-result-target" style="color:#E74C3C; margin-left:6px;">?</span> )
          </div>
        `;
      } else if (q.type === "clock") {
        stageHtml = `
          <div style="font-size:48px; line-height:1;">⏰</div>
          <div style="font-size:19px; font-weight:900; color:var(--dark-text);">
            Kim ngắn chỉ số <span style="color:#E74C3C; font-size:22px;">${q.hour}</span>, Kim dài chỉ số <span style="color:#27AE60; font-size:22px;">12</span>
          </div>
        `;
      } else {
        stageHtml = q.display || "";
      }

      container.innerHTML = `
        <div class="question-prompt">
          ${q.prompt}
          <button class="speaker-btn" onclick="speakClear('${q.speech}')">🔊 Nghe</button>
        </div>

        <div class="stage-box">${stageHtml}</div>

        <div class="choices-grid">
          ${q.choices.map(c => `
            <button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>
          `).join('')}
        </div>

        <div class="bottom-nav-bar">
          <button class="btn-step" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>
            ⬅️ Câu trước
          </button>
          <div class="question-tracker">Câu ${currentQuestionIndex + 1} / ${totalQ}</div>
          <button id="btn-next-step" class="btn-step next-btn" onclick="nextQuestion()">
            ${currentQuestionIndex === totalQ - 1 ? '🎉 Vòng tiếp theo' : '➡️ Câu tiếp'}
          </button>
        </div>
      `;

      speakClear(q.speech);
    }

    // ==========================================
    // 8. KIỂM TRA ĐÁP ÁN & ĐIỀU HƯỚNG
    // ==========================================
    function checkAnswer(btnElement, selected) {
      stopAllSpeech();
      const allBtns = document.querySelectorAll('.choice-btn');

      if (String(selected).trim().toLowerCase() === String(currentAnswer).trim().toLowerCase()) {
        allBtns.forEach(b => b.disabled = true);
        btnElement.classList.add('correct');
        playTone('correct');
        triggerConfetti();
        stars += 1;
        document.getElementById('stars-count').innerText = stars;

        const resTarget = document.getElementById('calc-result-target');
        if (resTarget) {
          resTarget.innerHTML = `<span class="calc-result-box">= ${currentAnswer}</span>`;
        }

        const nextBtn = document.getElementById('btn-next-step');
        if (nextBtn) nextBtn.classList.add('highlight');

        speakClear("Bé giỏi quá! Bé bấm nút Câu tiếp để làm câu tiếp theo nhé!");
      } else {
        btnElement.classList.add('wrong');
        playTone('wrong');
        speakClear("Bé thử lại một lần nữa nhé!");

        setTimeout(() => {
          btnElement.classList.remove('wrong');
        }, 700);
      }
    }

    function prevQuestion() {
      stopAllSpeech();
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
      }
    }

    function nextQuestion() {
      stopAllSpeech();
      const totalQ = TOPICS_DATA[currentTopicKey].questions.length;
      if (currentQuestionIndex < totalQ - 1) {
        currentQuestionIndex++;
        loadQuestion();
      } else {
        playTone('correct');
        triggerConfetti();
        speakClear("Tuyệt vời! Bé đã hoàn thành 1 vòng học! Chúng ta cùng bắt đầu lượt câu hỏi mới nào!");
        TOPICS_DATA[currentTopicKey].questions = shuffleArray(TOPICS_DATA[currentTopicKey].getQuestions());
        currentQuestionIndex = 0;
        loadQuestion();
      }
    }
  </script>
</body>
</html>
